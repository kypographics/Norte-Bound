name: norte_bound
description: "AI-assisted tourism discovery and itinerary planning for Ilocos Norte."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.4.0
  geolocator: ^14.1.2
  go_router: ^18.1.4
  google_fonts: ^9.0.0
  latlong2: ^0.10.1
  riverpod_annotation: ^4.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.10
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
