name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Optional version label for the APK filename (e.g. v0.1.0)'
        required: false
        type: string
      api_base_url:
        description: 'Optional API_BASE_URL override (--dart-define=API_BASE_URL=...)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Flutter code
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test

      - name: Build release APK
        working-directory: mobile
        env:
          API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL }}
        run: |
          if [ -n "$API_BASE_URL" ]; then
            flutter build apk --release --dart-define="API_BASE_URL=$API_BASE_URL"
          else
            flutter build apk --release
          fi

      - name: Package release APK
        id: package
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="sha-${GITHUB_SHA::7}"
          fi
          APK_NAME="norte-bound-${TAG}.apk"
          mkdir -p release-artifacts
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "release-artifacts/${APK_NAME}"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_path=release-artifacts/${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.apk_name }}
          path: ${{ steps.package.outputs.apk_path }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ steps.package.outputs.apk_path }}
